<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walcu — Llamada</title>
  <link rel="stylesheet" href="/call/styles.css">
</head>
<body>
  <main class="call-shell">
    <section class="call-card" aria-labelledby="call-title">
      <img class="call-logo" src="/call/walcu-logo.png" alt="Walcu">
      <h1 id="call-title">Configura tu llamada</h1>
      <p id="call-status">Comprobando dispositivos de audio…</p>

      <div id="call-denied" class="call-denied" hidden>
        <p>No hemos podido acceder a tu micrófono. Actívalo en los ajustes del sitio para Walcu y vuelve a intentarlo.</p>
        <button type="button" id="call-reload" class="call-cta">Reintentar</button>
      </div>

      <div id="call-devices" class="call-devices" hidden>
        <label class="call-field">
          <span class="call-field-label">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 14a3.5 3.5 0 0 0 3.5-3.5v-5a3.5 3.5 0 1 0-7 0v5A3.5 3.5 0 0 0 12 14Zm-5-3.5a1 1 0 1 1 2 0 3 3 0 0 0 6 0 1 1 0 1 1 2 0 5 5 0 0 1-4 4.9V19h2a1 1 0 1 1 0 2H9a1 1 0 0 1 0-2h2v-2.6a5 5 0 0 1-4-4.9Z"/></svg>
            Micrófono
          </span>
          <select id="call-mic"></select>
        </label>
        <label class="call-field" id="call-speaker-field" hidden>
          <span class="call-field-label">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9a2 2 0 0 1 2-2h3l4.3-3.6A1 1 0 0 1 15 4.2v15.6a1 1 0 0 1-1.7.8L9 17H6a2 2 0 0 1-2-2V9Zm13.7-1.7a1 1 0 0 1 1.4 0 5.3 5.3 0 0 1 0 7.4 1 1 0 1 1-1.4-1.4 3.3 3.3 0 0 0 0-4.6 1 1 0 0 1 0-1.4Zm2.8-2.8a1 1 0 0 1 1.4 0 9.2 9.2 0 0 1 0 15 1 1 0 1 1-1.4-1.4 7.2 7.2 0 0 0 0-12.2 1 1 0 0 1 0-1.4Z"/></svg>
            Altavoz
          </span>
          <select id="call-speaker"></select>
        </label>
        <div class="call-field call-level">
          <span class="call-field-label">Nivel de audio</span>
          <div class="call-meter"><div id="call-meter-fill" class="call-meter-fill"></div></div>
        </div>
        <button type="button" id="call-save" class="call-cta" disabled>Iniciar llamada</button>
        <p class="call-help">Podrás cambiar el micrófono durante la llamada.</p>
      </div>

      <div id="call-active" class="call-active" hidden>
        <p id="call-timer" class="call-timer">00:00</p>

        <div class="call-controls">
          <div class="call-control-group">
            <button type="button" id="call-mute" class="call-icon-btn" aria-pressed="false" aria-label="Silenciar micrófono">
              <svg id="call-mute-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 14a3.5 3.5 0 0 0 3.5-3.5v-5a3.5 3.5 0 1 0-7 0v5A3.5 3.5 0 0 0 12 14Zm-5-3.5a1 1 0 1 1 2 0 3 3 0 0 0 6 0 1 1 0 1 1 2 0 5 5 0 0 1-4 4.9V19h2a1 1 0 1 1 0 2H9a1 1 0 0 1 0-2h2v-2.6a5 5 0 0 1-4-4.9Z"/></svg>
            </button>
            <button type="button" id="call-mic-chevron" class="call-chevron-btn" aria-label="Elegir micrófono" aria-expanded="false" aria-haspopup="listbox">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div id="call-mic-popover" class="call-popover" role="listbox" hidden></div>
          </div>

          <div class="call-control-group" id="call-speaker-group">
            <button type="button" id="call-speaker-btn" class="call-icon-btn" aria-label="Elegir altavoz" aria-expanded="false" aria-haspopup="listbox">
              <svg id="call-speaker-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9a2 2 0 0 1 2-2h3l4.3-3.6A1 1 0 0 1 15 4.2v15.6a1 1 0 0 1-1.7.8L9 17H6a2 2 0 0 1-2-2V9Zm13.7-1.7a1 1 0 0 1 1.4 0 5.3 5.3 0 0 1 0 7.4 1 1 0 1 1-1.4-1.4 3.3 3.3 0 0 0 0-4.6 1 1 0 0 1 0-1.4Zm2.8-2.8a1 1 0 0 1 1.4 0 9.2 9.2 0 0 1 0 15 1 1 0 1 1-1.4-1.4 7.2 7.2 0 0 0 0-12.2 1 1 0 0 1 0-1.4Z"/></svg>
            </button>
            <button type="button" id="call-speaker-chevron" class="call-chevron-btn" aria-label="Elegir altavoz" aria-expanded="false" aria-haspopup="listbox">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div id="call-speaker-popover" class="call-popover" role="listbox" hidden></div>
          </div>

          <button type="button" id="call-hangup" class="call-icon-btn call-hangup" aria-label="Colgar">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.51-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
          </button>
        </div>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2.7.1/dist/twilio.min.js"></script>
  <script src="/call/index.js"></script>
</body>
</html>
