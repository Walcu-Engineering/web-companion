<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walcu Companion — Modal</title>
  <link rel="stylesheet" href="/iframe/modal.css">
</head>
<body>
  <div class="companion-modal-overlay" id="companion-modal-overlay">
    <div class="companion-modal-card" role="dialog" aria-modal="true" aria-label="Antes de llamar">
      <button type="button" class="companion-modal-close" aria-label="Cerrar">&times;</button>
      <h2 class="companion-modal-title">Antes de llamar</h2>

      <div id="companion-modal-denied" class="companion-modal-denied" hidden>
        <p>No hemos podido acceder a tu micrófono. Actívalo en los ajustes del sitio para este dominio y recarga la página.</p>
        <button type="button" class="companion-modal-reload">Recargar página</button>
      </div>

      <div id="companion-modal-devices" class="companion-modal-devices">
        <label class="companion-modal-field">
          Micrófono
          <select id="companion-modal-mic"></select>
        </label>
        <label class="companion-modal-field" id="companion-modal-speaker-field" hidden>
          Altavoz
          <select id="companion-modal-speaker"></select>
        </label>
        <div class="companion-modal-field">
          Nivel de audio
          <div class="companion-modal-meter">
            <div class="companion-modal-meter-fill" id="companion-modal-meter-fill"></div>
          </div>
        </div>
      </div>

      <button type="button" class="companion-modal-cta" disabled>Iniciar llamada</button>
    </div>
  </div>
  <script src="/iframe/modal.js"></script>
</body>
</html>
